[package]
name = "vobos"
version = "0.1.0"
edition = "2024"
authors = [ "Logan-010" ]
description = "vOBOS AI."

[lib]
name = "rustsam"
path = "src/rustsam/lib.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
color-eyre = "0.6.5"
cpal = "0.18.2"
hf-hub = "1.0.0"
indicatif = "0.18.6"
tokio = { version = "1.53.1", features = ["signal", "rt-multi-thread", "macros", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
whisper-rs = { version = "0.16.0", features = [ "tracing_backend", "vulkan", "openmp" ] }
once_cell = "1.17.0"
rig = "0.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
rpath = false
overflow-checks = false
